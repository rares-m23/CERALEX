  <style>
    :root {

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.6);
      border-bottom: 1px solid rgba(15,23,42,0.08);

    .topbar {

      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

      height: 80px;

      font-size: 32px;
      letter-spacing: 1px;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

    }

    /* Meniu */
    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

      text-decoration: none;
      color: var(--dark);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      transition: 0.3s;
    }
    .nav a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(15,23,42,0.12);
      background: #fff;
    }

      transform: translateY(-2px);
    }

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" aria-label="Închide">×</button>
  <img src="" alt="Imagine mărită" />
</div>

<script>
  // Tabs pentru categorii
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-panel');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const id = btn.dataset.tab;
      panels.forEach(p => p.hidden = p.id !== id);
      document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Animație reveal la scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('reveal');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.card').forEach(el => observer.observe(el));

  // Favorite (inimioară)
  document.querySelectorAll('.fav').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });

  // Slider cu dots
  document.querySelectorAll('.slider').forEach(slider => {
    const slides = slider.querySelector('.slides');
    const dots = slider.querySelectorAll('.dot');
    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        dots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        slides.style.transform = `translateX(-${i * 100}%)`;
      });
    });
  });

  // Lightbox
  const lightbox = document.getElementById('lightbox');
  const lbImg = lightbox.querySelector('img');
  document.querySelectorAll('.img-slot img, .img-double img, .slides img').forEach(img => {
    img.addEventListener('click', () => {
      lbImg.src = img.src;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
    });
  });
  lightbox.querySelector('.close').addEventListener('click', () => {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    lbImg.src = '';
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lbImg.src = '';
    }
  });

  // Contor livrări animat
  function animateCount(el, to = 128, duration = 1200) {
    const start = 0;
    const startTime = performance.now();
    function update(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const value = Math.floor(start + (to - start) * progress);
      el.textContent = value;
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }
  animateCount(document.getElementById('count'), 128);

  // Navigație smooth
  document.querySelectorAll('nav.nav a').forEach(a => {
    a.addEventListener('click', (e) => {
      const href = a.getAttribute('href');
      if (href.startsWith('#')) {
        e.preventDefault();
        const target = document.querySelector(href);
        if (!target) return;
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
</script>
